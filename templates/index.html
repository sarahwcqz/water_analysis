<!DOCTYPE html>
<html>

<head>
    <title>Analysis of water - Map</title>

    <!-- Leaflet CSS : nécessaire pour afficher la carte correctement -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- MarkerCluster CSS : style des clusters (points regroupés) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <style>
        body {
            display: flex;
            gap: 20px;
            font-family: sans-serif;
        }

        #menu {
            width: 200px;
        }

        #map {
            height: 600px;
            width: 800px;
        }
    </style>
</head>

<body>
    <div id="menu">
        <h3>Molecules</h3>
        <label><input type="checkbox" value="Calcium" checked> Calcium</label><br>
        <label><input type="checkbox" value="Magnesium" checked> Magnesium</label><br>
        <label><input type="checkbox" value="Sodium"> Sodium</label><br>
        <button id="update">Update map</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS : nécessaire pour afficher et manipuler la carte -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- MarkerCluster JS : plugin Leaflet pour regrouper les points superposés -->
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- JS custom : gère le chargement des données, les filtres et l'affichage des points -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
