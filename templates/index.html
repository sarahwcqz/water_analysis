<!DOCTYPE html>
<html>

<head>
    <title>Analysis of water - Map</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Leaflet CSS : nécessaire pour afficher la carte correctement -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- MarkerCluster CSS : style des clusters (points regroupés) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

</head>

<body>
    <div id="menu">
        <h3>Select the molecules you want to see</h3>
        <label><input type="checkbox" value="Mg2+" checked> Mg2+</label><br>
        <label><input type="checkbox" value="Ca2+" checked> Ca2+</label><br>
        <label><input type="checkbox" value="SO42-" checked> SO42-</label><br>
        <label><input type="checkbox" value="Cl-" checked> Cl-</label><br>
        <label><input type="checkbox" value="F-" checked> F-</label><br>
        <label><input type="checkbox" value="KNO3-" checked> KNO3-</label><br>
        <label><input type="checkbox" value="K+" checked> K+</label><br>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS : nécessaire pour afficher et manipuler la carte -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- MarkerCluster JS : plugin Leaflet pour regrouper les points superposés -->
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- chargement des données, les filtres et l'affichage des points -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
