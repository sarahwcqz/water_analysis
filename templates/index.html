<!DOCTYPE html>
<html>

<head>
    <title>Analysis of water - Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            display: flex;
            gap: 20px;
            font-family: sans-serif;
        }

        #menu {
            width: 200px;
        }

        #map {
            height: 600px;
            width: 800px;
        }
    </style>
</head>

<body>
    <div id="menu">
        <h3>Molecules</h3>
        <label><input type="checkbox" value="Calcium" checked> Calcium</label><br>
        <label><input type="checkbox" value="Magnesium" checked> Magnesium</label><br>
        <label><input type="checkbox" value="Sodium"> Sodium</label><br>
        <button id="update">Update map</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
